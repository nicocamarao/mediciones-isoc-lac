about.title=About
about.subtitle=A concise overview of the initiative and its regional workstreams.
about.route=Route: /about
about.intro1=📊 How prepared is Internet in our countries to face the security, resilience, accessibility and innovation challenges of the coming years?
about.intro2=At the ISOC LAC Measurement Working Group we work to answer that question with open data, comparable indicators and technical analysis that help us better understand the state of the Internet in Latin America and the Caribbean.
about.intro3=This is a collaborative regional initiative bringing together participants from ISOC Chapter Argentina, ISOC Brazil, ISOC Uruguay, Internet Society Chapter Venezuela, ISOC Ecuador, ISOC Chapter Paraguay, ISOC Panama, the ISOC Permanent Accessibility Group, and many other chapters, organizations, researchers, network operators, students and Internet professionals.
about.bullet1=DNSSEC, DANE, TLSA and NSEC3 for the security of the DNS ecosystem
about.bullet2=RPKI
about.bullet3=IPv6
about.bullet4=TLS
about.bullet5=DMARC
about.bullet6=HTTPS
about.bullet7=IPsec
about.bullet8=Post-Quantum Readiness indicators
about.bullet9=Universal Acceptance (IDN/EAI) for a more inclusive and multilingual Internet
about.bullet10=Open standards promoted by organizations such as the W3C
about.bullet11=Measurements based on the Open Fibre Data Standard
about.bullet12=Policy indicators about the 6 GHz spectrum in different countries
about.pillars=The platform currently integrates more than 200 measurements organized around three major pillars: Security, Universality and Accessibility.
about.closing=More importantly, we aim to turn these measurements into actionable knowledge for the technical community, academia, regulators, public policy leaders and everyone in the Internet ecosystem.
references.1.axis=Security
references.1.category=HTTPS / Web
references.1.title=Active HTTPS
references.1.what=Checks whether the site responds over HTTPS and whether the base publication has already been moved to the encrypted channel.
references.1.internal=The check starts with an HTTP/HTTPS request to the domain and observes response status, redirection and availability of the secure scheme.
references.1.command1=GET /https/:domain
references.1.command2=GET /headers/:domain
references.1.command3=Equivalent to validating whether HTTP redirects to HTTPS and whether the final response uses TLS.
references.2.axis=Security
references.2.category=Defensive headers
references.2.title=Defensive headers and security.txt
references.2.what=Evaluates whether the site exposes CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy and security.txt.
references.2.internal=Uses the site HTTP response, inspects headers and looks for the RFC 9116 file to see whether a security contact channel exists.
references.2.command1=GET /headers/:domain
references.2.command2=GET /securitytxt/:domain
references.2.command3=GET /caa/:domain
references.3.axis=Security
references.3.category=TLS / Cryptography
references.3.title=TLS and certificates
references.3.what=Measures the negotiated TLS version, the certificate chain, OCSP stapling and DANE/TLSA.
references.3.internal=Connects to the domain TLS service, compares version negotiation and reviews certificates, OCSP status and TLSA presence.
references.3.command1=GET /tlsinfo/:domain
references.3.command2=GET /sslchain/:domain
references.3.command3=GET /tlsa/:domain
references.4.axis=DNS Security
references.4.category=DNSSEC / DNS
references.4.title=DNSSEC and DNSViz
references.4.what=Validates whether DNSSEC is active, whether the parent publishes DS, whether the child publishes DNSKEY and what the full chain looks like in DNSViz.
references.4.internal=Resolves the DNSSEC chain, checks parent and child, reviews NSEC3 and uses DNSViz to surface delegation observations, warnings and errors.
references.4.command1=GET /dnssec/:domain
references.4.command2=GET /dnsviz/:domain?resolver=local
references.4.command3=GET /dnsrecords/:domain
references.4.command4=GET /txtrecords/:domain
references.5.axis=Security
references.5.category=Mail
references.5.title=SPF, DMARC and DKIM
references.5.what=Reviews DNS-based mail authentication to see whether the domain reduces spoofing and improves alignment.
references.5.internal=Looks up SPF and DMARC records and tests DKIM support to see whether the domain can sign mail with its own identity.
references.5.command1=GET /spf/:domain
references.5.command2=GET /dmarc/:domain
references.5.command3=GET /dkim/:domain?selector=support
references.6.axis=Security
references.6.category=Mail transport
references.6.title=MX, IPv6 on MX and STARTTLS
references.6.what=Checks whether MX servers exist, whether they advertise IPv6 and whether mail transport can negotiate encryption with STARTTLS.
references.6.internal=Resolves MX records and then performs connections and EHLO checks to inspect capabilities, support and per-server failures.
references.6.command1=GET /mx/:domain
references.6.command2=GET /mailipv6/:domain
references.6.command3=GET /starttls/:domain
references.7.axis=Universality
references.7.category=SMTPUTF8 / UA
references.7.title=SMTPUTF8
references.7.what=Checks whether MX servers advertise SMTPUTF8 to accept international addresses and support universal acceptance.
references.7.internal=Connects to each MX, sends EHLO and checks whether SMTPUTF8 appears in the server response.
references.7.command1=GET /smtputf8/:domain
references.7.command2=GET /mx/:domain
references.7.command3=EHLO against each MX to read the advertised capabilities
references.7.note=This is the key measurement for Internationalized Email Addressing (EAI).
references.8.axis=Universality
references.8.category=IPv4 and IPv6
references.8.title=IPv4 and IPv6
references.8.what=Checks whether the domain publishes A and AAAA records and whether critical services also respond over IPv6.
references.8.internal=Looks up the domain addresses and compares IPv4 and IPv6 publication in DNS and on MX hosts.
references.8.command1=GET /ipv4/:domain
references.8.command2=GET /ipv6/:domain
references.8.command3=GET /mailipv6/:domain
references.9.axis=Security
references.9.category=RPKI
references.9.title=RPKI and routing
references.9.what=Evaluates whether the observed routes for the domain are covered by ROAs and whether origin validation is correct.
references.9.internal=Checks route origin for detected IPs and compares it with RPKI coverage and ROV status.
references.9.command1=GET /rpki/:domain
references.9.command2=GET /routing/:domain
references.9.command3=GET /serverinfo/:domain
references.10.axis=Accessibility
references.10.category=W3C and web quality
references.10.title=Accessibility and quality
references.10.what=Validates HTML and web-quality metrics to detect structural, usability and technical support issues.
references.10.internal=Uses W3C validation and quality tools to summarize errors, warnings and experience signals.
references.10.command1=GET /w3c/:domain
references.10.command2=GET /quality/:domain
references.10.command3=GET /sitefeatures/:domain
references.11.axis=Lab
references.11.category=Extra tools
references.11.title=Auxiliary tools
references.11.what=Groups exploration and diagnostic measurements such as ports, traceroute, ping, social tags, archive and ranking.
references.11.internal=It does not define a single test; it groups several auxiliary checks for inspection, diagnosis and domain context.
references.11.command1=GET /openports/:domain
references.11.command2=GET /ping/:domain
references.11.command3=GET /pingv6/:domain
references.11.command4=GET /traceroute/:domain
references.11.command5=GET /archive/:domain
references.11.command6=GET /ranking/:domain
references.pageTitle=References
references.pageSubtitle=An overview of each measurement, what it validates internally and which queries or commands we use as the base.
