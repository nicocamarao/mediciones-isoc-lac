about.title=Sobre
about.subtitle=Uma visão resumida da iniciativa e de suas linhas de trabalho regionais.
about.route=Rota: /about
about.intro1=📊 Quão preparada está a Internet em nossos países para enfrentar os desafios de segurança, resiliência, acessibilidade e inovação dos próximos anos?
about.intro2=No Grupo de Trabalho de Medições da ISOC LAC trabalhamos para responder a essa pergunta por meio de dados abertos, indicadores comparáveis e análises técnicas que nos ajudam a compreender melhor o estado da Internet na América Latina e no Caribe.
about.intro3=Esta é uma iniciativa regional colaborativa que reúne participantes do capítulo ISOC Argentina, ISOC Brasil, ISOC Uruguai, Internet Society Chapter Venezuela, ISOC Equador, ISOC Paraguai, ISOC Panamá, o Grupo Permanente de Acessibilidade da ISOC e muitos outros capítulos, organizações, pesquisadores, operadores de rede, estudantes e profissionais da Internet.
about.bullet1=DNSSEC, DANE, TLSA e NSEC3 para a segurança do ecossistema DNS
about.bullet2=RPKI
about.bullet3=IPv6
about.bullet4=TLS
about.bullet5=DMARC
about.bullet6=HTTPS
about.bullet7=IPsec
about.bullet8=Indicadores de preparação para a era pós-quântica (Post-Quantum Readiness)
about.bullet9=Aceitação Universal (IDN/EAI) para uma Internet mais inclusiva e multilíngue
about.bullet10=Padrões abertos promovidos por organizações como o W3C
about.bullet11=Medições baseadas no Open Fibre Data Standard
about.bullet12=Indicadores de políticas sobre o espectro de 6 GHz em diferentes países
about.pillars=Atualmente, a plataforma integra mais de 200 medições organizadas em torno de três pilares: Segurança, Universalidade e Acessibilidade.
about.closing=Mais importante ainda, buscamos transformar essas medições em conhecimento acionável para a comunidade técnica, a academia, os reguladores, os responsáveis por políticas públicas e todos os atores do ecossistema da Internet.
references.1.axis=Segurança
references.1.category=HTTPS / Web
references.1.title=HTTPS ativo
references.1.what=Verifica se o site responde por HTTPS e se a publicação base já foi migrada para o canal criptografado.
references.1.internal=A verificação parte de uma requisição HTTP/HTTPS ao domínio e observa o estado da resposta, o redirecionamento e a disponibilidade do esquema seguro.
references.1.command1=GET /https/:dominio
references.1.command2=GET /headers/:dominio
references.1.command3=Equivale a validar se HTTP redireciona para HTTPS e se a resposta final usa TLS.
references.2.axis=Segurança
references.2.category=Cabeçalhos defensivos
references.2.title=Cabeçalhos defensivos e security.txt
references.2.what=Avalia se o site expõe CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy e security.txt.
references.2.internal=Usa a resposta HTTP do site, inspeciona os cabeçalhos e busca o arquivo RFC 9116 para ver se existe um canal de contato de segurança.
references.2.command1=GET /headers/:dominio
references.2.command2=GET /securitytxt/:dominio
references.2.command3=GET /caa/:dominio
references.3.axis=Segurança
references.3.category=TLS / Criptografia
references.3.title=TLS e certificados
references.3.what=Mede a versão TLS negociada, a cadeia de certificados, OCSP stapling e DANE/TLSA.
references.3.internal=Conecta-se ao serviço TLS do domínio, compara a negociação por versão e revisa certificados, estado OCSP e presença de TLSA.
references.3.command1=GET /tlsinfo/:dominio
references.3.command2=GET /sslchain/:dominio
references.3.command3=GET /tlsa/:dominio
references.4.axis=Segurança DNS
references.4.category=DNSSEC / DNS
references.4.title=DNSSEC e DNSViz
references.4.what=Valida se há DNSSEC ativo, se o pai publica DS, se o filho publica DNSKEY e como fica a cadeia completa no DNSViz.
references.4.internal=Resolve a cadeia DNSSEC, verifica pai e filho, revisa NSEC3 e usa o DNSViz para ver observações, avisos e erros de delegação.
references.4.command1=GET /dnssec/:dominio
references.4.command2=GET /dnsviz/:dominio?resolver=local
references.4.command3=GET /dnsrecords/:dominio
references.4.command4=GET /txtrecords/:dominio
references.5.axis=Segurança
references.5.category=Correio
references.5.title=SPF, DMARC e DKIM
references.5.what=Revisa a autenticação de e-mail baseada em DNS para ver se o domínio reduz a falsificação e melhora o alinhamento.
references.5.internal=Consulta os registros SPF e DMARC e testa o suporte DKIM para ver se o domínio pode assinar e-mails com identidade própria.
references.5.command1=GET /spf/:dominio
references.5.command2=GET /dmarc/:dominio
references.5.command3=GET /dkim/:dominio?selector=support
references.6.axis=Segurança
references.6.category=Transporte de correio
references.6.title=MX, IPv6 nos MX e STARTTLS
references.6.what=Verifica se há servidores MX, se anunciam IPv6 e se o transporte de e-mail pode negociar criptografia com STARTTLS.
references.6.internal=Resolve os MX e depois faz conexões e EHLO para ver capacidades, suportes e falhas por servidor.
references.6.command1=GET /mx/:dominio
references.6.command2=GET /mailipv6/:dominio
references.6.command3=GET /starttls/:dominio
references.7.axis=Universalidade
references.7.category=SMTPUTF8 / UA
references.7.title=SMTPUTF8
references.7.what=Verifica se os MX anunciam SMTPUTF8 para aceitar endereços internacionais e apoiar a aceitação universal.
references.7.internal=Conecta-se a cada MX, envia EHLO e verifica se a capacidade SMTPUTF8 aparece na resposta do servidor.
references.7.command1=GET /smtputf8/:dominio
references.7.command2=GET /mx/:dominio
references.7.command3=EHLO contra cada MX para ler as capacidades anunciadas
references.7.note=É a medição-chave para Endereços de E-mail Internacionalizados (EAI).
references.8.axis=Universalidade
references.8.category=IPv4 e IPv6
references.8.title=IPv4 e IPv6
references.8.what=Verifica se o domínio publica A e AAAA e se os serviços críticos também respondem por IPv6.
references.8.internal=Busca os endereços do domínio e compara a publicação de IPv4 e IPv6 no DNS e nos MX.
references.8.command1=GET /ipv4/:dominio
references.8.command2=GET /ipv6/:dominio
references.8.command3=GET /mailipv6/:dominio
references.9.axis=Segurança
references.9.category=RPKI
references.9.title=RPKI e routing
references.9.what=Avalia se as rotas observadas para o domínio ficam cobertas por ROAs e se a validação de origem está correta.
references.9.internal=Consulta a origem da rota para os IPs detectados e contrasta isso com a cobertura RPKI e o estado ROV.
references.9.command1=GET /rpki/:dominio
references.9.command2=GET /routing/:dominio
references.9.command3=GET /serverinfo/:dominio
references.10.axis=Acessibilidade
references.10.category=W3C e qualidade web
references.10.title=Acessibilidade e qualidade
references.10.what=Valida HTML e métricas de qualidade web para detectar problemas estruturais, de usabilidade e de suporte técnico.
references.10.internal=A revisão usa validação W3C e ferramentas de qualidade para somar erros, avisos e sinais de experiência.
references.10.command1=GET /w3c/:dominio
references.10.command2=GET /quality/:dominio
references.10.command3=GET /sitefeatures/:dominio
references.11.axis=Laboratório
references.11.category=Ferramentas extras
references.11.title=Ferramentas auxiliares
references.11.what=Agrupa medições de exploração e diagnóstico como portas, traceroute, ping, redes sociais, arquivo e ranking.
references.11.internal=Não define um único teste; agrupa várias leituras auxiliares para inspeção, diagnóstico e contexto do domínio.
references.11.command1=GET /openports/:dominio
references.11.command2=GET /ping/:dominio
references.11.command3=GET /pingv6/:dominio
references.11.command4=GET /traceroute/:dominio
references.11.command5=GET /archive/:dominio
references.11.command6=GET /ranking/:dominio
references.pageTitle=Referências
references.pageSubtitle=Panorama de cada medição, o que valida internamente e quais consultas ou comandos usamos como base.
references.route=Rota: /referencias
