about.title=Acerca de
about.subtitle=Una visión resumida de la iniciativa y sus líneas de trabajo regionales.
about.route=Ruta: /about
about.intro1=📊 ¿Qué tan preparado está Internet en nuestros países para enfrentar los desafíos de seguridad, resiliencia, accesibilidad e innovación de los próximos años?
about.intro2=En el Grupo de Trabajo de Mediciones de ISOC LAC trabajamos para responder esa pregunta mediante datos abiertos, indicadores comparables y análisis técnicos que nos ayudan a comprender mejor el estado de Internet en América Latina y el Caribe.
about.intro3=Esta es una iniciativa regional colaborativa que reúne a participantes de ISOC Capítulo Argentina, ISOC Brasil, ISOC Uruguay, Internet Society Capítulo Venezuela, ISOC Ecuador, ISOC Capítulo Paraguay, ISOC Panamá, el Grupo Permanente de Accesibilidad de ISOC, y muchos otros capítulos, organizaciones, investigadores, operadores de redes, estudiantes y profesionales de Internet.
about.bullet1=DNSSEC, DANE, TLSA y NSEC3 para la seguridad del ecosistema DNS
about.bullet2=RPKI
about.bullet3=IPv6
about.bullet4=TLS
about.bullet5=DMARC
about.bullet6=HTTPS
about.bullet7=IPsec
about.bullet8=Indicadores de preparación para la era post-cuántica (Post-Quantum Readiness)
about.bullet9=Aceptación Universal (IDN/EAI) para una Internet más inclusiva y multilingüe
about.bullet10=Estándares abiertos promovidos por organizaciones como el W3C
about.bullet11=Mediciones basadas en el Open Fibre Data Standard
about.bullet12=Indicadores de políticas sobre el espectro de 6 GHz en distintos países
about.pillars=Actualmente, la plataforma integra más de 200 mediciones organizadas en torno a tres grandes pilares: Seguridad, Universalidad y Accesibilidad.
about.closing=Más importante aún, buscamos transformar estas mediciones en conocimiento accionable para la comunidad técnica, la academia, los reguladores, los responsables de políticas públicas y todos los actores del ecosistema de Internet.
references.1.axis=Seguridad
references.1.category=HTTPS / Web
references.1.title=HTTPS activo
references.1.what=Verifica si el sitio responde por HTTPS y si la publicación base ya está migrada al canal cifrado.
references.1.internal=La comprobación parte de una petición HTTP/HTTPS sobre el dominio y observa el estado de respuesta, la redirección y la disponibilidad del esquema seguro.
references.1.command1=GET /https/:dominio
references.1.command2=GET /headers/:dominio
references.1.command3=Equivale a validar si HTTP redirige hacia HTTPS y si la respuesta final usa TLS.
references.2.axis=Seguridad
references.2.category=Cabeceras defensivas
references.2.title=Cabeceras defensivas y security.txt
references.2.what=Evalúa si el sitio expone CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy y security.txt.
references.2.internal=Toma la respuesta HTTP del sitio, inspecciona las cabeceras y busca el archivo RFC 9116 para ver si existe un canal de contacto de seguridad.
references.2.command1=GET /headers/:dominio
references.2.command2=GET /securitytxt/:dominio
references.2.command3=GET /caa/:dominio
references.3.axis=Seguridad
references.3.category=TLS / Criptografía
references.3.title=TLS y certificados
references.3.what=Mide la versión TLS negociada, la cadena de certificados, OCSP stapling y DANE/TLSA.
references.3.internal=Conecta al servicio TLS del dominio, compara la negociación por versión y revisa certificados, estado OCSP y presencia de TLSA.
references.3.command1=GET /tlsinfo/:dominio
references.3.command2=GET /sslchain/:dominio
references.3.command3=GET /tlsa/:dominio
references.4.axis=Seguridad DNS
references.4.category=DNSSEC / DNS
references.4.title=DNSSEC y DNSViz
references.4.what=Valida si hay DNSSEC activo, si el padre publica DS, si el hijo publica DNSKEY y cómo se ve la cadena completa en DNSViz.
references.4.internal=Resuelve la cadena DNSSEC, comprueba padre e hijo, revisa NSEC3 y usa DNSViz para ver observaciones, advertencias y errores de delegación.
references.4.command1=GET /dnssec/:dominio
references.4.command2=GET /dnsviz/:dominio?resolver=local
references.4.command3=GET /dnsrecords/:dominio
references.4.command4=GET /txtrecords/:dominio
references.5.axis=Seguridad
references.5.category=Correo
references.5.title=SPF, DMARC y DKIM
references.5.what=Revisa la autenticación de correo basada en DNS para ver si el dominio reduce suplantación y mejora alineación.
references.5.internal=Consulta los registros SPF y DMARC, y prueba soporte DKIM para ver si el dominio puede firmar correo con identidad propia.
references.5.command1=GET /spf/:dominio
references.5.command2=GET /dmarc/:dominio
references.5.command3=GET /dkim/:dominio?selector=support
references.6.axis=Seguridad
references.6.category=Transporte de correo
references.6.title=MX, IPv6 en MX y STARTTLS
references.6.what=Verifica si hay servidores MX, si anuncian IPv6 y si el transporte de correo puede negociar cifrado con STARTTLS.
references.6.internal=Se resuelven los MX y luego se hacen conexiones y EHLO para ver capacidades, soportes y fallos por servidor.
references.6.command1=GET /mx/:dominio
references.6.command2=GET /mailipv6/:dominio
references.6.command3=GET /starttls/:dominio
references.7.axis=Universalidad
references.7.category=SMTPUTF8 / UA
references.7.title=SMTPUTF8
references.7.what=Comprueba si los MX anuncian SMTPUTF8 para aceptar direcciones internacionales y apoyar la aceptación universal.
references.7.internal=Se conecta a cada MX, envía EHLO y revisa si la capacidad SMTPUTF8 aparece en la respuesta del servidor.
references.7.command1=GET /smtputf8/:dominio
references.7.command2=GET /mx/:dominio
references.7.command3=EHLO contra cada MX para leer las capacidades anunciadas
references.7.note=Es la medición clave para Direcciones de Correo Electrónico Internacionalizadas (EAI).
references.8.axis=Universalidad
references.8.category=IPv4 e IPv6
references.8.title=IPv4 e IPv6
references.8.what=Comprueba si el dominio publica A y AAAA y si los servicios críticos también responden por IPv6.
references.8.internal=Busca las direcciones del dominio y compara la publicación de IPv4 e IPv6 en DNS y en los MX.
references.8.command1=GET /ipv4/:dominio
references.8.command2=GET /ipv6/:dominio
references.8.command3=GET /mailipv6/:dominio
references.9.axis=Seguridad
references.9.category=RPKI
references.9.title=RPKI y routing
references.9.what=Evalúa si las rutas observadas para el dominio quedan cubiertas por ROAs y si la validación de origen es correcta.
references.9.internal=Consulta el origen de ruta para las IP detectadas y lo contrasta con la cobertura RPKI y el estado ROV.
references.9.command1=GET /rpki/:dominio
references.9.command2=GET /routing/:dominio
references.9.command3=GET /serverinfo/:dominio
references.10.axis=Accesibilidad
references.10.category=W3C y calidad web
references.10.title=Accesibilidad y calidad
references.10.what=Valida HTML y métricas de calidad web para detectar problemas estructurales, de usabilidad y de soporte técnico.
references.10.internal=La revisión usa validación W3C y herramientas de calidad para sumar errores, avisos y señales de experiencia.
references.10.command1=GET /w3c/:dominio
references.10.command2=GET /quality/:dominio
references.10.command3=GET /sitefeatures/:dominio
references.11.axis=Laboratorio
references.11.category=Herramientas extra
references.11.title=Herramientas auxiliares
references.11.what=Agrupa mediciones de exploración y diagnóstico como puertos, traceroute, ping, redes sociales, archivo y ranking.
references.11.internal=No define una sola prueba; agrupa varias lecturas auxiliares para inspección, diagnóstico y contexto del dominio.
references.11.command1=GET /openports/:dominio
references.11.command2=GET /ping/:dominio
references.11.command3=GET /pingv6/:dominio
references.11.command4=GET /traceroute/:dominio
references.11.command5=GET /archive/:dominio
references.11.command6=GET /ranking/:dominio
references.pageTitle=Referencias
references.pageSubtitle=Panorama de cada medición, qué valida internamente y qué consultas o comandos usamos como base.
references.route=Ruta: /referencias
